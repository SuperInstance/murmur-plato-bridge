[package]
name = "murmur-plato-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridge between Murmur-agent's knowledge tensor and PLATO fleet rooms"
authors = ["SuperInstance"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.0"
once_cell = "1.19"
url = "2.5"

[dev-dependencies]
tempfile = "3.0"

[[test]]
name = "test_mapping"
path = "tests/test_mapping.rs"

[[test]]
name = "test_quality"
path = "tests/test_quality.rs"
